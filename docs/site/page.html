<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<meta name="docs-version" content="{version}">
<meta name="docs-base" content="{base}">
<meta name="docs-page" content="{page}">
<script>
  // The theme before the first paint: this tab's choice, or the system's.
  (function () {
    var t = null;
    try { t = sessionStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="icon" href="{root}assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{root}assets/site.css">
<script src="{root}assets/site.js" defer></script>
<script src="{root}assets/player.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to the content</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="{root}">
      <img class="logo logo-ink" src="{root}assets/logo-ink.svg" alt="Source Cooperative" width="97" height="26">
      <img class="logo logo-bone" src="{root}assets/logo-bone.svg" alt="Source Cooperative" width="97" height="26">
      <span>CLI guide</span>
    </a>
    <div class="spacer"></div>
    <label class="version">
      <span>Version</span>
      <select id="version" disabled>
        <option selected>{version}</option>
      </select>
    </label>
    <a class="top-link" href="{repo}">GitHub</a>
    <button class="theme" type="button" aria-label="Dark mode" aria-pressed="false" title="Switch to dark">
      <svg class="icon-moon" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>
<div class="old-version" role="status" hidden></div>
<div class="layout">
  <nav class="toc" aria-label="Guide">
    <details open>
      <summary>Contents</summary>
      <ul>{nav}</ul>
    </details>
  </nav>
  <main id="main">
{body}
    <nav class="pager" aria-label="Pages">{pager}</nav>
  </main>
</div>
<footer class="bottom">
  <div class="bottom-inner">
    <span>Source Cooperative (a Radiant Earth initiative)</span>
    <a href="https://source.coop">source.coop</a>
    <a href="{repo}/edit/main/README.md">Edit this guide on GitHub</a>
    <span>Demos use made-up records on a local stand-in for the API.</span>
  </div>
</footer>
</body>
</html>
