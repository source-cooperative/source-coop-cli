name: Staging build

# Builds a branch with `--features staging`, so it signs in to and calls
# source.coop's staging environment, for team members to install and test
# without building it themselves. The binary is `source-coop-staging`, so it
# sits beside a production `source-coop`. Each run replaces the binaries on
# one rolling pre-release, tagged `staging`, which is never "Latest": the
# release installers and Homebrew keep the real release, and neither the
# Release nor the Docs workflow runs for it. CONTRIBUTING.md says how to use it.
#
# On a PR that changes this file or the install script, it only builds.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: main
  pull_request:
    paths: [".github/workflows/staging-build.yml", "staging/install.sh"]

permissions:
  contents: write

concurrency:
  group: staging-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Linux libraries for the keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libdbus-1-dev pkg-config
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: staging-${{ matrix.target }}
      - run: cargo build --release --locked --features staging --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir pack
          cp target/${{ matrix.target }}/release/source-coop pack/source-coop-staging
          tar -C pack -czf source-coop-staging-${{ matrix.target }}.tar.gz source-coop-staging
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: source-coop-staging-${{ matrix.target }}.tar.gz

  publish:
    name: Publish the staging pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the staging pre-release
        run: |
          sha=$(git rev-parse HEAD)
          cp staging/install.sh dist/install.sh
          cat > notes.md <<EOF
          Built from \`$REF\` at $sha with \`--features staging\`: it signs in to and calls source.coop's **staging** environment. For testing only; each run of *Staging build* replaces it.

          Install or update \`source-coop-staging\` (macOS or Linux):

          \`\`\`bash
          curl -LsSf https://github.com/${{ github.repository }}/releases/download/staging/install.sh | sh
          \`\`\`
          EOF
          # A new release each time, on the tag moved to this commit, so the
          # date and commit shown are this build's.
          gh release delete staging --yes --cleanup-tag 2>/dev/null || true
          git tag -f staging "$sha"
          git push -f origin refs/tags/staging
          gh release create staging dist/* --prerelease --latest=false \
            --title "Staging build: $REF ($(git rev-parse --short HEAD))" --notes-file notes.md
